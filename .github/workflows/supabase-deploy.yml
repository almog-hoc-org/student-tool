name: Supabase Deploy

# פורס מיגרציות ו-edge functions לפרויקט ה-Supabase.
# רץ אוטומטית על כל שינוי בתיקיית supabase/ ב-main, וגם ידנית מהטאב Actions.
#
# דורש שני סודות ב-Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN — טוקן אישי מ-supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  — סיסמת ה-Database של הפרויקט (Project Settings → Database)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: rdbrwoahbqfjqfjaahhp
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets are configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::חסר הסוד SUPABASE_ACCESS_TOKEN — הוסף אותו ב-Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::חסר הסוד SUPABASE_DB_PASSWORD — הוסף אותו ב-Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy chat-ai --project-ref "$PROJECT_REF" --use-api

      - name: Summary
        run: |
          echo "## פריסת Supabase הושלמה ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- מיגרציות הוחלו (כולל הגנת admin_notes)" >> "$GITHUB_STEP_SUMMARY"
          echo "- chat-ai נפרס (תיקון הודעות יתומות)" >> "$GITHUB_STEP_SUMMARY"
